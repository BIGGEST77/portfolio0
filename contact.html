<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href='https://cdn.boxicons.com/3.0.7/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/3.0.7/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css">
    <title>Nbrain - Home</title>
</head>
<body>
     <!-- navbar starts here -->
    <header>
        <a href="index.html"  class="logo">Nbrain.</a>
        <i class='bx  bx-menu' id="menu-icon"></i> 
        <nav class="menu">
            
                <a href="index.html" class="active">Home</a>
                <a href="index.html#about">About</a>
                <a href="index.html#services">Services</a>
                <a href="index.html#portfolio">Projects</a>
                <a href="contact.html">Contact</a>
           
        </nav>
    </header>
    <main>
        <section class="contact" id="contact">
            <div class="wrapper">
            <div class="contact-content">
                <h2 class="heading">Contact <span>Me</span></h2>
                <h3>You can put a message here but press yours informations before</h3>
                <form action="get post">
                     <div class="input-box">
                       <span class="icon"><i class='bx  bx-mail-open' ></i> </span>
                        <input type="email" placeholder="Your email" required>
                        <label>Email</label>
                     </div>
                      <div class="input-box">
                       <span class="icon"><i class='bx  bx-lock-open' ></i> </span>
                        <input type="password" placeholder="Your password" required>
                        <label>Password</label>
                     </div>
                     <div class="text-area">
                        <span class="icon"><i class='bx  bx-message'></i>  </span>
                        <textarea placeholder="Your message" required></textarea>
                        <label>Message</label>
                     </div>
                     
                   
                    <button type="submit" class="btn">Send Message</button>
                </form>
            </div>
           </div> 
        </section>
        <script src="https://unpkg.com/scrollreveal"></script>

<script src="js/script.js"></script>
</body>
</html>
